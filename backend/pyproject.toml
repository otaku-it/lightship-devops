[project]
name = "lightship-devops-api"
version = "0.1.0"
description = "Lightship lightweight DevOps release platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "pymysql==1.1.1",
  "pydantic-settings==2.9.1",
  "python-jose[cryptography]==3.4.0",
  "bcrypt==4.3.0",
  "paramiko==3.5.1",
  "httpx==0.28.1",
  "cryptography==44.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
