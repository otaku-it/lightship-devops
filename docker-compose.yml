services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lightship
      MYSQL_USER: lightship
      MYSQL_PASSWORD: lightship
      MYSQL_ROOT_PASSWORD: root-lightship
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-lightship"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    environment:
      DATABASE_URL: mysql+pymysql://lightship:lightship@mysql:3306/lightship?charset=utf8mb4
      SECRET_KEY: local-development-secret-change-before-production
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: change-me-now
      CORS_ORIGINS: http://localhost:5173,http://localhost:8088
      EXECUTOR_MODE: real
      CREDENTIAL_ENCRYPTION_KEY: local-credential-key-change-before-production
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-3600}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  mysql_data:
